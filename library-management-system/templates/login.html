{% extends "base.html" %}

{% block title %}Login | LibraryPro{% endblock %}

{% block content %}
<div class="container fade-in-up">
    <div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 170px);">
        <div class="col-lg-5 col-md-8">
            <div class="glass-panel p-4 p-md-5 position-relative overflow-hidden">
                <div class="blob blob-1"></div>
                <div class="blob blob-2"></div>

                <div class="position-relative">
                    <div class="text-center mb-4">
                        <div class="icon-chip mx-auto mb-3"><i class="fa-solid fa-shield-halved"></i></div>
                        <h2 class="mb-1">Admin Login</h2>
                        <p class="text-soft mb-0">Secure access to LibraryPro dashboard</p>
                    </div>

                    {% if error_message %}
                    <div class="alert alert-danger py-2">{{ error_message }}</div>
                    {% endif %}

                    <form method="post" action="{{ url_for('login_page') }}" class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Email / Username</label>
                            <input class="form-control form-control-modern" type="text" name="identity" placeholder="admin@library.com" value="{{ identity_value or '' }}" autocomplete="username" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <input id="passwordInput" class="form-control form-control-modern" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                                <button class="btn btn-soft" type="button" data-toggle-password data-target="passwordInput">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="col-12 d-flex justify-content-between align-items-center">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember" name="remember" value="1">
                                <label class="form-check-label text-soft" for="remember">Remember me</label>
                            </div>
                            <a href="{{ url_for('register_page') }}" class="text-soft small text-decoration-none">Need an account?</a>
                        </div>

                        <div class="col-12 d-grid mt-2">
                            <button class="btn btn-neon" type="submit"><i class="fa-solid fa-right-to-bracket me-1"></i>Sign In</button>
                        </div>

                        <div class="col-12 text-center">
                            <span class="text-soft">New student?</span>
                            <a class="text-decoration-none ms-1" href="{{ url_for('register_page') }}">Register here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
